[project]
name = "ai-pushup-counter"
version = "1.0.0"
description = "AI-powered push-up counter: RF-DETR pose estimation, joint-angle state machine, and real-time form analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Push-Up Counter" }]
keywords = ["computer-vision", "pose-estimation", "rf-detr", "fitness", "streamlit"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
